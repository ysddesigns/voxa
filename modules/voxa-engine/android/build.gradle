plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.voxa'
version = '0.1.0'

android {
  namespace "app.voxa.engine"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// libs/, src/main/jniLibs/ and src/main/assets/voxa-models/ come from
// scripts/fetch-engine.ps1 (sherpa-onnx 2.0.1, phone ABIs only).
dependencies {
  def classes = file('libs/sherpa-onnx-classes.jar')
  if (!classes.exists()) {
    throw new GradleException("modules/voxa-engine is missing sherpa-onnx. Run .\\scripts\\fetch-engine.ps1 first.")
  }
  implementation files(classes)
  // Scan text: Latin-script recognizer with the model bundled in the app (about 4 MB), so it
  // works offline from the first run. The unbundled variant downloads its model via Play Services.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
